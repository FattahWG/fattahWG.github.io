name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default. Only the deploy job can write to Pages.
permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Origin of the QA Lab API Worker. Empty: the QA Lab shows the recorded run only.
      VITE_API_URL: ${{ vars.QA_LAB_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Typecheck the frontend and the QA Lab backend
        run: npm run typecheck

      - name: Build and prerender the site
        run: npm run build

      - name: Playwright end-to-end tests
        run: npm run test:e2e

      - name: Bruno HTTP checks
        run: |
          node apps/frontend/scripts/serve.mjs &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:4321/ && break; sleep 1; done
          mkdir -p reports
          cd tests/api
          npx bru run --env local -r --reporter-html ../../reports/api.html --reporter-junit ../../reports/api-junit.xml

      - name: Add the test reports to the site
        run: |
          mkdir -p apps/frontend/dist/qa-report
          cp -r playwright-report/. apps/frontend/dist/qa-report/
          cp reports/api.html apps/frontend/dist/qa-report/api.html

      - name: Keep the reports when a test fails
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            playwright-report
            reports
          retention-days: 14

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/frontend/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
