name: Deploy QA Lab backend

on:
  push:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - 'packages/shared/**'
      - 'package-lock.json'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

# Deploys never overlap, and a running deploy is never cancelled.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    # Skipped until the QA Lab is set up (docs/QA-LAB-SETUP.md): the first deploy is by hand, then set QA_LAB_API_URL.
    if: ${{ vars.QA_LAB_API_URL != '' }}
    runs-on: ubuntu-latest
    # The Cloudflare secrets are open to this environment only.
    environment:
      name: production
    defaults:
      run:
        working-directory: apps/backend
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        working-directory: .
        run: npm ci
      - name: Typecheck the backend
        run: npm run typecheck
      # Migrate first, then deploy. A migration must also work with the old code.
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote
      - name: Deploy with Wrangler
        run: npx wrangler deploy
